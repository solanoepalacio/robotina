services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: robotina
      POSTGRES_USER: robotina
      POSTGRES_PASSWORD: robotina
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robotina -d robotina"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: redis-server --appendonly yes --appendfsync always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rq-dashboard:
    image: eoranged/rq-dashboard:latest
    ports:
      - "9181:9181"
    environment:
      RQ_DASHBOARD_REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  # Phase 13 / DASH-09: Queue Visibility Dashboard. Independent (D-01) —
  # NO other service depends_on this one; agent/gateway (when they land in
  # compose) must NOT add dashboard as a dependency. Reads Postgres only.
  dashboard:
    build: .
    command: uv run dashboard
    environment:
      DATABASE_URL: postgresql://robotina:robotina@postgres:5432/robotina
      DASHBOARD_PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
