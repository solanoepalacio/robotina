[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotina"
version = "0.1.0"
description = "AI agent component of the household management system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "rq>=2.5",
    "redis>=4.0",
    "psycopg2-binary",
    "pydantic>=2.7",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "langwatch>=0.1",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-api>=1.25",
    "python-telegram-bot>=21",
    "tavily-python>=0.3",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv",
    "jinja2>=3.1",  # Phase 13 / DASH-04 — dashboard template engine
    "recipe-scrapers>=15.11.0",
    "trafilatura>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "rq-dashboard",
]

[project.scripts]
agent = "robotina.queue.runner:main"
migrate = "robotina.db:run_migrations"
"experiments.recipe_research" = "experiments.recipe_research:main"
"experiments.recipe_load" = "experiments.recipe_load:main"
"experiments.multi_recipe_eval" = "experiments.robotina.multi_recipe_eval:main"
gateway = "robotina.gateway:main"
all = "robotina.all:main"
dashboard = "robotina.dashboard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robotina", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require live Postgres + Redis)",
]

[dependency-groups]
dev = [
    "pandas>=3.0.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.21",
]
